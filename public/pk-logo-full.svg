<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Emerald Badge Gradient -->
    <linearGradient id="fullPkBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <radialGradient id="fullPkRingGlow" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#059669" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.6" />
    </radialGradient>

    <!-- Badge Drop Shadow -->
    <filter id="fullPkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.3" />
    </filter>

    <!-- Left Arrow Gradient -->
    <linearGradient id="logoLeftGrad" x1="48" y1="4" x2="0" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" stop-opacity="1" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>

    <!-- Right Arrow Gradient -->
    <linearGradient id="logoRightGrad" x1="0" y1="4" x2="48" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" stop-opacity="1" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- ================= EMBLEM (LEFT) ================= -->
  <g transform="translate(10, 10)">
    <!-- Outer Ring -->
    <circle cx="50" cy="50" r="48" fill="none" stroke="url(#fullPkRingGlow)" stroke-width="2.5" />
    
    <!-- Main Circle -->
    <circle cx="50" cy="50" r="42" fill="url(#fullPkBgGrad)" filter="url(#fullPkShadow)" stroke="#047857" stroke-width="1.5" />
    
    <!-- Text PK -->
    <text 
      x="50" 
      y="63" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-size="40" 
      font-weight="900" 
      letter-spacing="1.5" 
      fill="#FFFFFF" 
      text-anchor="middle"
    >PK</text>
  </g>

  <!-- ================= TYPOGRAPHY (RIGHT) ================= -->
  <g transform="translate(125, 0)">
    <!-- Main Wordmark: PEHLAKADAM -->
    <text 
      x="180" 
      y="60" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-size="44" 
      font-weight="900" 
      letter-spacing="-0.5" 
      fill="#09090B" 
      text-anchor="middle"
    >PEHLAKADAM</text>

    <!-- Tagline Group: Choose best Get best -->
    <g transform="translate(180, 84)">
      <!-- Left Gradient Arrow Line -->
      <g transform="translate(-170, -4)">
        <path d="M 5 1 L 0 4 L 5 7 M 0 4 H 48" stroke="url(#logoLeftGrad)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>

      <!-- Centered Tagline Text -->
      <text 
        x="0" 
        y="0" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="14.5" 
        font-weight="700" 
        font-style="italic" 
        fill="#71717A" 
        text-anchor="middle"
      >Choose best Get best</text>

      <!-- Right Gradient Arrow Line -->
      <g transform="translate(122, -4)">
        <path d="M 43 1 L 48 4 L 43 7 M 0 4 H 48" stroke="url(#logoRightGrad)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>
    </g>
  </g>
</svg>
