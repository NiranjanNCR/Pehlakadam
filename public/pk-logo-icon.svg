<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Emerald Gradient -->
    <linearGradient id="pkBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <!-- Outer Ring Glow -->
    <radialGradient id="pkRingGlow" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#059669" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.6" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="pkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#059669" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Border Ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#pkRingGlow)" stroke-width="4" />

  <!-- Main Emerald Circle with Shadow -->
  <circle cx="100" cy="100" r="86" fill="url(#pkBgGrad)" filter="url(#pkShadow)" stroke="#047857" stroke-width="2" />

  <!-- Monogram PK -->
  <text 
    x="100" 
    y="126" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
    font-size="82" 
    font-weight="900" 
    letter-spacing="2" 
    fill="#FFFFFF" 
    text-anchor="middle"
  >PK</text>
</svg>
